name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    # setup.sh は macOS 前提の処理(defaults, Application Support のリンク)を含むため macOS で実行する。
    # 実際の mise で dotfiles だけを適用し、brew / gh / cursor / code はスタブに差し替える。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install mise (latest; the runner's Homebrew index can be stale)
        run: |
          brew update
          brew install mise || true
          brew upgrade mise || true
          mise --version
      - name: Run setup.sh regression tests
        run: test/setup_test.sh
