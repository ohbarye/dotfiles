[dotfiles]
"~/.gitconfig.os" = { source = "~/dotfiles/.gitconfig.macos", mode = "symlink" }
"~/Library/Application Support/Code/User/settings.json" = { source = "~/dotfiles/editors/vscode/settings.json", mode = "symlink" }
"~/Library/Application Support/Code/User/keybindings.json" = { source = "~/dotfiles/editors/vscode/keybindings.json", mode = "symlink" }
"~/Library/Application Support/Cursor/User/settings.json" = { source = "~/dotfiles/editors/cursor/settings.json", mode = "symlink" }
"~/Library/Application Support/Cursor/User/keybindings.json" = { source = "~/dotfiles/editors/cursor/keybindings.json", mode = "symlink" }
"~/.config/karabiner/karabiner.json" = { source = "~/dotfiles/karabiner/karabiner.json", mode = "symlink" }

[bootstrap.macos.defaults."com.apple.dock"]
autohide = true
tilesize = 64
orientation = "right"

[bootstrap.macos.defaults."com.apple.finder"]
FXPreferredViewStyle = "clmv"

[bootstrap.macos.defaults.NSGlobalDomain]
KeyRepeat = 2
InitialKeyRepeat = 15
ApplePressAndHoldEnabled = false
NSAutomaticSpellingCorrectionEnabled = false
NSAutomaticCapitalizationEnabled = false
NSAutomaticPeriodSubstitutionEnabled = false
NSAutomaticQuoteSubstitutionEnabled = false
NSAutomaticDashSubstitutionEnabled = false

[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
Clicking = true

[bootstrap.macos.defaults."com.apple.menuextra.clock"]
ShowSeconds = true

# tap 由来のパッケージは、mise が Homebrew の API で解決できず、tap の Ruby 定義を評価しようとする。
# そのとき Ruby 3 以上が必要になり、macOS 標準の Ruby(2.x)しかない新しい Mac では失敗して
# 他のパッケージごと止まる。brew 自身(portable Ruby 同梱)に任せるため、フックで入れる。
[bootstrap.hooks]
post-defaults = "killall Dock Finder SystemUIServer || true"
post-packages = "brew install steipete/tap/summarize openclaw/tap/gogcli withgraphite/tap/graphite || true; brew install --cask grishka/grishka/neardrop || true"
